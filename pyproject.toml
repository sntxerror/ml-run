[project]
name = "antgpu-run"
version = "0.1.0"
description = "Workflow runner for AntGPU training templates: dataset, validate, test run, full run."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
antgpu-run = "antgpu_run.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antgpu_run"]

[dependency-groups]
dev = ["pytest>=8.2"]
